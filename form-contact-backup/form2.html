<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <title>Form Contact us</title>
    <style>
        .form-container {
            max-width: 400px; 
            background-color: #ffffff; 
            padding: 20px;
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); 
            margin: auto;
        } 
        .form-section {
            background-color: #062e27; 
            padding: 50px 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .btn {
            background-color: #062e27;
            border: none;
            padding: 7px 18px;
            border-radius: 5px;
            cursor: pointer;
            color: #ffffff;
        }
        .btn:hover {
            background-color: gold;
        }
    </style>
</head>
<body>
    <div class="form-section">
        <div class="form-container">
            <form id="contactForm" method="post">
                <div class="form-group">
                    <label for="firstName" style="margin-bottom: 13px;">Nama Anda</label>
                    <input type="text" class="form-control" id="firstName">
                </div>
                <div class="form-group">
                    <label for="email" style="margin-bottom: 13px;">Email</label>
                    <input type="email" class="form-control" id="email">
                </div>
                <div class="form-group">
                    <label for="nomorHp" style="margin-bottom: 13px;">No. Handphone</label>
                    <input type="text" class="form-control" id="nomorHp">
                </div>
                <div class="form-group">
                    <label for="dropdownBantu" style="margin-bottom: 13px;">Apa yang bisa kami bantu?</label>
                    <select class="form-select" id="dropdown" name="dropdown">
                        <option class="form-control" selected >Select Option</option>
                        <option value="1">Kendala</option>
                        <option value="2">Kritikan</option>
                        <option value="3">Masukan</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="pesan" style="margin-bottom: 13px;">Pesan</label>
                    <textarea type="text" class="form-control" id="pesan" row="5"></textarea>
                </div>

                <!-- Turnstile Widget -->
                <div class="cf-turnstile" data-sitekey="0x4AAAAAAA51iUR7xae3OeTD"></div>

                <div class="form-group">
                    <button type="submit" class="btn">Submit</button>
                </div>
            </form>
        </div>
    </div>
      
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
