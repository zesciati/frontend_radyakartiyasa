<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <title>Form Contact us</title>
    <style>
        .form-container {
            max-width: 400px; 
            background-color: #ffffff; 
            padding: 20px;
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); 
            margin: auto; 
        }
        .form-section {
            background-color: #062e27; 
            padding: 50px 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .btn {
            background-color: #062e27;
            border: none;
            padding: 7px 18px;
            border-radius: 5px;
            cursor: pointer;
            color: #ffffff;
        }
        .btn:hover {
            background-color: gold;
        }
    </style>
</head>
<body>
    <div class="form-section">
        <div class="form-container">
            <form id="contactForm">
                <div class="form-group">
                    <label for="firstName">Nama Anda</label>
                    <input type="text" class="form-control" id="firstName" name="firstName" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="nomorHp">No. Handphone</label>
                    <input type="text" class="form-control" id="nomorHp" name="nomorHp" required>
                </div>
                <div class="form-group">
                    <label for="dropdown">Apa yang bisa kami bantu?</label>
                    <select class="form-select" id="dropdown" name="dropdown" required>
                        <option value="" disabled selected>Select Option</option>
                        <option value="1">Kendala</option>
                        <option value="2">Kritikan</option>
                        <option value="3">Masukan</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="pesan">Pesan</label>
                    <textarea class="form-control" id="pesan" name="pesan" rows="5" required></textarea>
                </div>

                <!-- Turnstile Captcha -->
                <div class="cf-turnstile" data-sitekey="0x4AAAAAAA5vz42_Xn64X6GG"></div> <!-- SITE KEY BELUM DIGANTI -->

                <div class="form-group">
                    <button type="submit" class="btn">Submit</button>
                </div>
            </form>
            <div id="notification" style="display: none; margin-top: 20px;"></div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Cloudflare Turnstile Script -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="script.js"></script>
    <!-- <script src="submit.php"></script> -->

   
</body>
</html>
