<!DOCTYPE html>
<html lang="en">
<head>

  <title>Accessibilities - Destination Page</title>
  <style>

    }

      text-align: center;
      padding: 15px;
    }
    .feature-box i {
      font-size: 2rem;

    }
    .feature-box h5 {
      font-size: 1rem;
      font-weight: bold;

                <i class="bi bi-circle-fill" style="color: #D6A84D;"></i>
            </div>
            <h5 class="text-start">Ramah Kunjungan Tunanetra</h5>
            <p class="text-start">Ramah kunjungan tunanetra dengan bantuan audio.</p>
