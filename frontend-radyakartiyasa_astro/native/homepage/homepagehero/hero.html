<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="hero.css">
  <title>Responsive Hero</title>
  
</head>
<body>
  
  <div class="container-fluid p-0 position-relative">
    <div class="row m-0 position-relative">
      <div class="col-12 position-relative w-100">
        <!-- WELCOME -->
        <div class="position-relative overflow-hidden" style="height: 100vh; ">
          <img class="w-100 h-100 responsive-image" src="../img/keraton-tari.png" alt="Hero Image" style="object-fit: cover;">
          <div class="gradient-dark position-absolute top-0 start-0 w-100 h-100"></div>
          <div class="row justify-content-center align-items-center h-100 m-0">
            <div class="col-auto">
              <div class="position-relative p-4 bg-white bg-opacity-10 rounded responsive-content" style="backdrop-filter: blur(20px); max-width: 468px;">
                <div class="mb-3">
                  <div class="text-secondary">Selamat datang di</div>
                  <div class="fw-bold text-light fs-4">Museum Pariwisata Kagungan Dalem Keraton Yogyakarta</div>
                  <p class="text-muted">Temukan Keagungan Tradisi, Keindahan, dan Pengetahuan di Keraton Yogyakarta</p>
                </div>
                <a href="#" class="btn btn-custom-color1 align-items-center text-white mt-5">
                  Rencanakan Kunjungan Anda
                  <img src="../img/icon/arrow-right-gold.svg" alt="arrow" class="ms-2" style="width: 20px; height: 20px;">
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  
</body>
</html>
