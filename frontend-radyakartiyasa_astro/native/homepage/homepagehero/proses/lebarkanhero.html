<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum Pariwisata Kagungan Dalem Keraton Yogyakarta</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero-section {
            position: relative;
            height: 835px;
            overflow: hidden;
            
        }

        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gradient-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                180deg,
                rgba(0, 0, 0, 0.1) 0.07%,
                rgba(1, 1, 27, 0.3) 41.89%,
                rgba(14, 49, 33, 1) 100%
            );
        }

        .content-box {
            background: rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(20px);
            padding: 33px 30px;
            max-width: 468px;
            position: absolute;
            left: 9%;
            bottom: 10%;
            
        }

        .welcome-label {
            color: #404b5a;
            font-size: 16px;
            line-height: 38px;
            margin-bottom: 12px;
        }

        .title {
            color: #e5e7eb;
            font-size: 30px;
            line-height: 30px;
            font-weight: 600;
            margin-bottom: 18px;
        }

        .subtitle {
            color: #9c9c9c;
            font-size: 18px;
            line-height: 25px;
            margin-bottom: 35px;
        }

        .custom-button {
            background-color: #0e3121;
            border: 1px solid #0e3121;
            color: white;
            padding: 8px 16px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 500;
            text-decoration: none;
            height: 48px;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .hero-section {
                height: 100vh;
            }

            .content-box {
                left: 50%;
                transform: translateX(-50%);
                width: 90%;
                max-width: 400px;
                bottom: 50px;
            }

            .title {
                font-size: 24px;
                line-height: 28px;
            }

            .subtitle {
                font-size: 16px;
                line-height: 22px;
            }
        }

        @media (max-width: 576px) {
            .content-box {
                padding: 20px;
            }

            .title {
                font-size: 20px;
                line-height: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="hero-section">
        <img src="./img/keraton-tari.png" alt="Museum Keraton Yogyakarta" class="hero-image">
        <div class="gradient-overlay"></div>
        
        <div class="content-box">
            <div class="welcome-label">Selamat datang di</div>
            <h1 class="title">Museum Pariwisata Kagungan Dalem Keraton Yogyakarta</h1>
            <p class="subtitle">Temukan Keagungan Tradisi, Keindahan, dan Pengetahuan di Keraton Yogyakarta</p>
            <a href="#" class="custom-button btn">
                Rencanakan Kunjungan Anda
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-arrow-right" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8z"/>
                </svg>
            </a>
        </div>
    </div>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
