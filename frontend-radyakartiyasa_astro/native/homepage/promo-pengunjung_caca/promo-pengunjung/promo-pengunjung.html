<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- <link rel="stylesheet" href="contactus.css"> -->
    <title>Contact us</title>
    <style>
    .promo-section {
      background: url('./img/image-promo.png') no-repeat center center/cover;
      background-color: #062e27; /* fallback for overlay */
      color: #fff;
      padding: 40px;
      position: relative;
    }
    .promo-section::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(6, 46, 39, 0.85); /* dark overlay */
      z-index: 1;
    }
    .promo-content {
      position: relative;
      z-index: 2;
    }
    .promo-title {
      font-size: 2rem;
      font-weight: bold;
      color: #e3a539;
      -webkit-text-stroke: 1px #000;
    }
    .promo-text {
      font-size: 1rem;
      margin-bottom: 20px;
    }
    .promo-btn {
      background-color: transparent;
      border: 1px solid #fff;
      color: #fff;
      padding: 10px 20px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: all 0.3s ease;
    }
    .promo-btn:hover {
      background-color: #e3a539;
      border-color: #e3a539;
      color: #000;
    }
    .promo-btn i {
      margin-left: 10px;
    }
    .bi-arrow-right{
        color: #e3a539;
    }
    .bi-arrow-right:hover{
        color: #000;
    }
    </style>
</head>
<body>
    <section class="promo-section d-flex align-items-center">
        <div class="container promo-content">
          <div class="row align-items-center">
            <div class="col-lg-8">
              <h1 class="promo-title">Promo Kunjungan Museum</h1>
              <p class="promo-text">
                Nikmati acara eksklusif, akses tak terbatas ke pameran dan Ruang Anggota,</br> ditambah diskon di toko-toko Museum, kafe, dan restoran.
              </p>
            </div>
            <div class="col-lg-4 text-lg-end text-center">
              <a href="#" class="promo-btn">
                Informasi selengkapnya <i class="bi bi-arrow-right"></i>
              </a>
            </div>
          </div>
        </div>
      </section>
      
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
