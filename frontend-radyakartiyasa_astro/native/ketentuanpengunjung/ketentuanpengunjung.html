<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="ketentuanpengunjung.css">
  <title>Ketentuan Pengunjung</title>
</head>
<body>fdfdf
  <div class="frame-34 container-fluid">
    <div class="row">
      <!-- Content Section -->
      <div class="col-lg-6 col-md-12 d-flex align-items-center">
        <div class="container frame-45">
          <div class="row">
            <div class="col-md-12 heading-and-supporting-text">
              <div class="frame-40">
                <img class="group-6" src="./img/icon/Group 6.svg" alt="Icon" />
                <div class="heading">Ketentuan Pengunjung</div>
              </div>
            </div>
          </div>
          <div class="row frame-43">
            <div class="col-md-12">
              <ul class="nav nav-tabs horizontal-tabs" id="myTab" role="tablist">
                <li class="nav-item tab-button" role="presentation">
                  <button
                    class="nav-link active text2"
                    id="home-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#home-tab-pane"
                    type="button"
                    role="tab"
                    aria-controls="home-tab-pane"
                    aria-selected="true">Do's</button>
                </li>
                <li class="nav-item tab-button2" role="presentation">
                  <button
                    class="nav-link text3"
                    id="profile-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#profile-tab-pane"
                    type="button"
                    role="tab"
                    aria-controls="profile-tab-pane"
                    aria-selected="false">Don'ts</button>
                </li>
              </ul>
              <div class="tab-content frame-42" id="myTabContent">
                <div
                  class="tab-pane fade show active"
                  id="home-tab-pane"
                  role="tabpanel"
                  aria-labelledby="home-tab"
                  tabindex="0">
                  <div class="check-list-item">
                    <div class="check-icons">
                      <img class="check" src="./img/icon/Check icons.svg" alt="Check" />
                    </div>
                    <div class="datang-1-jam-lebih-awal">Datang 1 jam lebih awal</div>
                  </div>
                  <div class="check-list-item">
                    <div class="check-icons">
                      <img class="check2" src="./img/icon/Check icons.svg" alt="Check" />
                    </div>
                    <div class="mengenakan-pakaian-yang-sopan-nyaman-dan-berlengan">
                      Mengenakan pakaian yang sopan, nyaman, dan berlengan
                    </div>
                  </div>
                  <div class="check-list-item">
                    <div class="check-icons">
                      <img class="check3" src="./img/icon/Check icons.svg" alt="Check" />
                    </div>
                    <div
                      class="diperbolehkan-mendokumentasikan-koleksi-sesuai-arahan-petugas">
                      Diperbolehkan mendokumentasikan koleksi sesuai arahan
                      petugas
                    </div>
                  </div>
                </div>
                <div
                  class="tab-pane fade"
                  id="profile-tab-pane"
                  role="tabpanel"
                  aria-labelledby="profile-tab"
                  tabindex="0">
                  <p>Isi dari Tab Don'ts</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Image Section -->
      <div class="col-lg-6 col-md-12 d-flex align-items-center justify-content-center">
        <img
          class="image3 img-fluid w-100"
          src="./img/bangunandepankeraton.png"
          alt="Bangunan Keraton" 
          />
      </div>
    </div>
  </div>

</html>
