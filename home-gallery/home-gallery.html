<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Museum</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-image: url('./img/teras-background.png');
      background-size: cover;
      background-repeat: repeat;
    }
    .gallery-header {
      position: absolute; 
      top: 20px; 
      left: 20px; 
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: flex-start; 
    }

    .gallery-header .badge {
      background-color: #d4edda;
      color: #155724;
      font-size: 14px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 5px;
      margin-bottom: 5px;
    }

    .gallery-header h1 {
      font-size: 30px;
      color: #1d3c34;
      margin: 0;
      display: flex;
      align-items: center;
    }

    .gallery-header .logo-keraton {
      width: 60px;
      height: 55px;
      margin-right: 10px;
    }
    .card {
      border: none;
    }
    .card-img-top {
      object-fit: cover;
      height: 300px; 
      width: 100%;
      border-radius: 0%;
    }
    .d-flex {
      position: relative;
    }
    .d-flex .btn {
      border-radius: 50%;
      padding: 2px 7px;
      font-size: 18px; 
      margin: 0 10px;
    }

    .d-flex .btn i {
      font-size: 1.0rem;
    }
  </style>
</head>

<body>
  <div class="container py-5 position-relative mt-4">
    <!-- Header Section -->
    <div class="gallery-header">
      <span class="badge">Gallery Museum</span>
      <h1 class="title mt-2">
        <img src="./img/logo-keraton.png" class="logo-keraton" alt="Logo Keraton">Teras Foto
      </h1>
    </div>

    <!-- Gallery Section -->
    <div class="row g-4 mt-5">
      <!-- Image 1 -->
      <div class="col-12 col-sm-6 col-md-6 col-lg-3">
        <div class="card">
          <img src="./img/keretaraja.png" class="card-img-top" alt="Kereta Kencana">
          <div class="card-body">
            <p class="card-text">Kereta Kencana Kagungan Dalem Museum Waharanatha</p>
          </div>
        </div>
      </div>

      <!-- Image 2 -->
      <div class="col-12 col-sm-6 col-md-6 col-lg-3">
        <div class="card">
          <img src="./img/pajangankuda.png" class="card-img-top" alt="Koleksi Museum">
          <div class="card-body">
            <p class="card-text">Koleksi di Kagungan Dalem Museum Waharanatha</p>
          </div>
        </div>
      </div>

      <!-- Image 3 -->
      <div class="col-12 col-sm-6 col-md-6 col-lg-3">
        <div class="card">
          <img src="./img/keraton-ngayogyakarta.webp" class="card-img-top" alt="Museum Kedhaton">
          <div class="card-body">
            <p class="card-text">Kagungan Dalem Museum Kedhaton</p>
          </div>
        </div>
      </div>

      <!-- Image 4 -->
      <div class="col-12 col-sm-6 col-md-6 col-lg-3">
        <div class="card">
          <img src="./img/taman-sari2.png" class="card-img-top" alt="Taman Sari">
          <div class="card-body">
            <p class="card-text">Salah satu sudut Kagungan Dalem Taman Sari</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Navigation Arrows -->
    <div class="d-flex mt-4">
      <button class="btn btn-outline-secondary"><i class="bi bi-chevron-left"></i></button>
      <button class="btn btn-outline-secondary"><i class="bi bi-chevron-right"></i></button>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
